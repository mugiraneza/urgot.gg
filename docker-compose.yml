services:
  postgres:
    image: postgres:17-alpine
    container_name: urgot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urgot}
      POSTGRES_USER: ${POSTGRES_USER:-urgot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urgot}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urgot} -d ${POSTGRES_DB:-urgot}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: urgot-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      RIOT_KEY: ${RIOT_KEY:-}
      RIOT_IMPORT_WORKERS: ${RIOT_IMPORT_WORKERS:-5}
      API_GUNICORN_WORKERS: ${API_GUNICORN_WORKERS:-2}
      RIOT_IMPORT_CACHE_MAX_SIZE: ${RIOT_IMPORT_CACHE_MAX_SIZE:-1000}
      POSTGRES_DB: ${POSTGRES_DB:-urgot}
      POSTGRES_USER: ${POSTGRES_USER:-urgot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urgot}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
      SQLITE_IMPORT_PATH: ${SQLITE_IMPORT_PATH:-/app/import_db.sqlite3}
    volumes:
      - ./back:/app
    ports:
      - "81:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8000)); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${API_MEM_LIMIT:-768m}
    mem_reservation: ${API_MEM_RESERVATION:-512m}
    command: >
      sh -c "
        python manage.py migrate &&
        gunicorn back.wsgi:application --bind 0.0.0.0:8000 --workers=${API_GUNICORN_WORKERS:-2}
      "

  import-worker:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: urgot-import-worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      RIOT_KEY: ${RIOT_KEY:-}
      RIOT_IMPORT_WORKERS: ${RIOT_IMPORT_WORKERS:-5}
      RIOT_IMPORT_CACHE_MAX_SIZE: ${RIOT_IMPORT_CACHE_MAX_SIZE:-1000}
      POSTGRES_DB: ${POSTGRES_DB:-urgot}
      POSTGRES_USER: ${POSTGRES_USER:-urgot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urgot}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
      SQLITE_IMPORT_PATH: ${SQLITE_IMPORT_PATH:-/app/import_db.sqlite3}
    volumes:
      - ./back:/app
    mem_limit: ${IMPORT_WORKER_MEM_LIMIT:-512m}
    mem_reservation: ${IMPORT_WORKER_MEM_RESERVATION:-256m}
    command: >
      sh -c "
        python manage.py poll_tracked_imports --interval-minutes 15
      "

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: urgot-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8001:80"
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    mem_reservation: ${FRONTEND_MEM_RESERVATION:-128m}

volumes:
  postgres_data:
